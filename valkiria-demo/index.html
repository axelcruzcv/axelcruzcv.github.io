<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F3EE" />
  <title>Valkiria Equestrian Club — Demo</title>
  <meta name="description" content="Demo web de Valkiria Equestrian Club — Vaulting y Equinoterapia." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --wine:#5A1428;
      --deep:#34101C;
      --gold:#CFA55A;
      --ivory:#F4EEE7;
      --paper:#FBF9F6;
      --ink:#2B2426;
      --muted:#746B67;
      --line:rgba(90,20,40,.15);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:clamp(18px,4vw,54px);
      font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }

    button,a{font:inherit}
    button{color:inherit}

    .site-card{
      width:min(1180px,100%);
      min-height:min(690px,82vh);
      display:grid;
      grid-template-columns:42.5% 57.5%;
      overflow:hidden;
      border-radius:36px;
      background:var(--ivory);
      border:1px solid rgba(90,20,40,.06);
      box-shadow:
        0 32px 80px rgba(52,16,28,.10),
        0 6px 22px rgba(52,16,28,.05);
      animation:floatCard 9s ease-in-out infinite;
    }

    .info-panel{
      min-width:0;
      padding:clamp(28px,4vw,54px);
      display:flex;
      flex-direction:column;
      position:relative;
      z-index:3;
    }

    .brand{
      width:max-content;
      border:0;
      padding:0;
      background:transparent;
      cursor:pointer;
      text-align:left;
      color:var(--wine);
      font-family:"Cormorant Garamond",serif;
      font-size:21px;
      line-height:1;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      transition:opacity .25s ease;
    }
    .brand:hover{opacity:.68}

    .copy-wrap{
      width:min(100%,410px);
      margin:auto 0;
      padding:42px 0 34px;
      transition:opacity .28s ease,transform .28s ease;
    }
    .copy-wrap.is-changing{opacity:0;transform:translateY(8px)}

    .eyebrow{
      margin:0 0 16px;
      color:var(--wine);
      font-size:11px;
      line-height:1.3;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 20px;
      color:var(--deep);
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(48px,5vw,72px);
      line-height:.9;
      letter-spacing:-.035em;
      font-weight:500;
    }

    .lead{
      margin:0 0 14px;
      max-width:390px;
      color:var(--deep);
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(24px,2.2vw,33px);
      line-height:1.04;
      letter-spacing:-.015em;
      font-weight:500;
    }

    .body-copy{
      max-width:360px;
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.75;
    }

    .details{
      display:none;
      gap:9px;
      margin-top:22px;
      color:var(--deep);
      font-size:13px;
      line-height:1.4;
    }
    .details.visible{display:grid}
    .detail-row{
      display:flex;
      align-items:center;
      gap:10px;
      padding-top:9px;
      border-top:1px solid var(--line);
    }
    .detail-label{font-weight:600}
    .detail-value{color:var(--muted)}

    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:auto;
    }

    .tab{
      min-height:37px;
      border:1px solid rgba(90,20,40,.22);
      border-radius:999px;
      padding:9px 14px;
      background:transparent;
      color:var(--deep);
      cursor:pointer;
      font-size:12px;
      font-weight:500;
      line-height:1;
      transition:
        color .22s ease,
        background .22s ease,
        border-color .22s ease,
        transform .22s ease;
    }
    .tab:hover,.tab:focus-visible,.tab.active{
      color:white;
      background:var(--wine);
      border-color:var(--wine);
      transform:translateY(-1px);
      outline:none;
    }

    .visual-panel{
      position:relative;
      min-width:0;
      min-height:100%;
      overflow:hidden;
      background:#957a65;
    }

    .slide{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      opacity:0;
      transform:scale(1.035);
      filter:saturate(.88) contrast(.98);
      transition:opacity 1s ease,transform 5.6s ease;
    }
    .slide.active{opacity:1;transform:scale(1)}

    .visual-panel::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,rgba(52,16,28,.08),transparent 26%),
        linear-gradient(0deg,rgba(34,17,18,.22),transparent 30%);
      z-index:2;
    }

    .photo-meta{
      position:absolute;
      left:25px;
      right:25px;
      bottom:22px;
      z-index:4;
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:24px;
      color:white;
    }

    .photo-label{
      font-size:10px;
      line-height:1.3;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      opacity:.88;
    }

    .counter{
      font-size:10px;
      line-height:1;
      letter-spacing:.12em;
      opacity:.88;
      white-space:nowrap;
    }

    .progress{
      position:absolute;
      left:25px;
      right:25px;
      bottom:12px;
      height:1px;
      z-index:4;
      background:rgba(255,255,255,.26);
      overflow:hidden;
    }
    .progress-bar{height:100%;width:0;background:white}
    .progress-bar.running{animation:progress 5s linear forwards}

    .demo-tag{
      position:absolute;
      top:23px;
      right:24px;
      z-index:4;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:999px;
      color:white;
      background:rgba(35,20,20,.12);
      backdrop-filter:blur(8px);
      font-size:9px;
      line-height:1;
      font-weight:600;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    @keyframes progress{from{width:0}to{width:100%}}
    @keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    @media (max-width:820px){
      body{display:block;padding:16px;min-height:100svh}
      .site-card{
        min-height:0;
        grid-template-columns:1fr;
        border-radius:28px;
        animation:none;
      }
      .info-panel{min-height:410px;padding:30px 26px 24px}
      .copy-wrap{padding:34px 0 26px}
      h1{font-size:52px}
      .lead{font-size:27px}
      .visual-panel{min-height:390px}
    }

    @media (max-width:480px){
      body{padding:10px}
      .site-card{border-radius:23px}
      .info-panel{padding:26px 20px 21px;min-height:395px}
      .brand{font-size:18px}
      .copy-wrap{padding:30px 0 22px}
      h1{font-size:46px}
      .lead{font-size:24px}
      .tabs{gap:6px}
      .tab{padding:9px 11px;font-size:11px}
      .visual-panel{min-height:330px}
      .photo-meta{left:18px;right:18px;bottom:20px}
      .progress{left:18px;right:18px}
      .demo-tag{top:18px;right:18px}
    }

    @media (prefers-reduced-motion:reduce){
      .site-card{animation:none}
      .slide,.copy-wrap,.tab{transition:none}
      .progress-bar.running{animation:none;width:100%}
    }
  </style>
</head>
<body>
  <main class="site-card" aria-label="Valkiria Equestrian Club">
    <section class="info-panel" aria-label="Información">
      <button class="brand" id="homeButton" type="button" aria-label="Volver a la portada">Valkiria</button>

      <div class="copy-wrap" id="copyWrap" aria-live="polite">
        <p class="eyebrow" id="eyebrow">Valkiria Equestrian Club</p>
        <h1 id="title">Valkiria<br>Equestrian Club</h1>
        <p class="lead" id="lead">Clases de Vaulting y Equinoterapia.</p>
        <p class="body-copy" id="bodyCopy">Movimiento, confianza y conexión a través del caballo.</p>
        <div class="details" id="details"></div>
      </div>

      <nav class="tabs" aria-label="Secciones de Valkiria">
        <button class="tab" type="button" data-section="vaulting">Vaulting</button>
        <button class="tab" type="button" data-section="therapy">Equinoterapia</button>
        <button class="tab" type="button" data-section="location">Ubicación</button>
        <button class="tab" type="button" data-section="contact">Contacto</button>
      </nav>
    </section>

    <section class="visual-panel" aria-label="Galería fotográfica">
      <img class="slide active" id="slideA" alt="Caballo en entorno ecuestre" />
      <img class="slide" id="slideB" alt="Escena ecuestre" />
      <div class="demo-tag">Demo visual</div>
      <div class="photo-meta">
        <span class="photo-label" id="photoLabel">Valkiria Equestrian Club</span>
        <span class="counter" id="counter">01 / 03</span>
      </div>
      <div class="progress"><div class="progress-bar running" id="progressBar"></div></div>
    </section>
  </main>

  <script>
    (() => {
      const IMG = {
        calm: 'https://images.unsplash.com/photo-1771102427333-550cb82bf7c6?auto=format&fit=crop&q=82&w=1800',
        portrait: 'https://images.unsplash.com/photo-1767295755630-73b7d67178ab?auto=format&fit=crop&q=82&w=1800',
        saddle: 'https://images.unsplash.com/photo-1765987461484-b6955f722973?auto=format&fit=crop&q=82&w=1800',
        forest: 'https://images.unsplash.com/photo-1770665912308-cfcb9b08747a?auto=format&fit=crop&q=82&w=1800',
        sportA: 'https://images.unsplash.com/photo-1780207196948-933755108a27?auto=format&fit=crop&q=82&w=1800',
        sportB: 'https://images.unsplash.com/photo-1780207486812-f981c5e2e696?auto=format&fit=crop&q=82&w=1800',
        connection: 'https://images.unsplash.com/photo-1733864640879-0f60da19b62a?auto=format&fit=crop&q=82&w=1800',
        stable: 'https://images.unsplash.com/photo-1762714477260-c8041cccceff?auto=format&fit=crop&q=82&w=1800'
      };

      const sections = {
        main: {
          eyebrow: 'Valkiria Equestrian Club',
          title: 'Valkiria<br>Equestrian Club',
          lead: 'Clases de Vaulting y Equinoterapia.',
          body: 'Movimiento, confianza y conexión a través del caballo.',
          label: 'Valkiria Equestrian Club',
          details: [],
          images: [IMG.saddle, IMG.calm, IMG.forest],
          alts: ['Caballo ensillado en exteriores', 'Persona junto a un caballo', 'Caballo en un entorno natural']
        },
        vaulting: {
          eyebrow: 'Vaulting · Movimiento · Disciplina',
          title: 'Vaulting',
          lead: 'Formamos atletas,<br>inspiramos campeonas.',
          body: 'Una disciplina que integra gimnasia y equitación para desarrollar equilibrio, técnica, confianza y expresión.',
          label: 'Vaulting',
          details: [],
          images: [IMG.sportA, IMG.sportB, IMG.saddle],
          alts: ['Atleta ecuestre en movimiento', 'Jinete y caballo durante una prueba', 'Caballo preparado para entrenamiento']
        },
        therapy: {
          eyebrow: 'Equinoterapia · Conexión · Bienestar',
          title: 'Equinoterapia',
          lead: 'Generamos conexión<br>entre caballo y persona.',
          body: 'Un acompañamiento cercano donde el vínculo y el movimiento del caballo forman parte de una experiencia personalizada.',
          label: 'Equinoterapia',
          details: [],
          images: [IMG.connection, IMG.calm, IMG.portrait],
          alts: ['Persona conectando con caballos', 'Momento cercano entre persona y caballo', 'Retrato de caballo']
        },
        location: {
          eyebrow: 'Ubicación',
          title: 'Ven a<br>conocernos.',
          lead: 'Estamos en el Estado de México.',
          body: 'Escríbenos para recibir la ubicación exacta, indicaciones y coordinar tu visita a Valkiria.',
          label: 'Ubicación',
          details: [],
          images: [IMG.stable, IMG.forest, IMG.saddle],
          alts: ['Caballo dentro de instalaciones ecuestres', 'Caballo en un entorno natural', 'Caballo en exteriores']
        },
        contact: {
          eyebrow: 'Contacto',
          title: '¡Únete a<br>nosotros!',
          lead: 'Estamos para servirte.',
          body: 'Escríbenos para conocer horarios, disponibilidad y encontrar la opción ideal para ti.',
          label: 'Contacto',
          details: [
            ['WhatsApp / Teléfono', 'Agregar dato final'],
            ['Correo electrónico', 'Agregar dato final']
          ],
          images: [IMG.calm, IMG.connection, IMG.saddle],
          alts: ['Persona junto a un caballo', 'Persona rodeada de caballos', 'Caballo ensillado en exteriores']
        }
      };

      const copyWrap = document.getElementById('copyWrap');
      const eyebrow = document.getElementById('eyebrow');
      const title = document.getElementById('title');
      const lead = document.getElementById('lead');
      const bodyCopy = document.getElementById('bodyCopy');
      const details = document.getElementById('details');
      const photoLabel = document.getElementById('photoLabel');
      const counter = document.getElementById('counter');
      const progressBar = document.getElementById('progressBar');
      const slideA = document.getElementById('slideA');
      const slideB = document.getElementById('slideB');
      const tabs = [...document.querySelectorAll('.tab')];

      let currentSection = 'main';
      let currentImage = 0;
      let front = 'A';
      let interval;
      let copyTimeout;

      function setDetails(rows) {
        details.innerHTML = '';
        if (!rows.length) {
          details.classList.remove('visible');
          return;
        }
        rows.forEach(([label, value]) => {
          const row = document.createElement('div');
          row.className = 'detail-row';
          row.innerHTML = `<span class="detail-label">${label}</span><span class="detail-value">${value}</span>`;
          details.appendChild(row);
        });
        details.classList.add('visible');
      }

      function restartProgress() {
        progressBar.classList.remove('running');
        void progressBar.offsetWidth;
        progressBar.classList.add('running');
      }

      function showImage(index, immediate = false) {
        const data = sections[currentSection];
        const total = data.images.length;
        const actual = index % total;
        const incoming = front === 'A' ? slideB : slideA;
        const outgoing = front === 'A' ? slideA : slideB;

        incoming.src = data.images[actual];
        incoming.alt = data.alts[actual];

        if (immediate) {
          outgoing.classList.remove('active');
          incoming.classList.add('active');
        } else {
          requestAnimationFrame(() => {
            incoming.classList.add('active');
            outgoing.classList.remove('active');
          });
        }

        front = front === 'A' ? 'B' : 'A';
        counter.textContent = `${String(actual + 1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
        restartProgress();
      }

      function startCarousel() {
        clearInterval(interval);
        interval = setInterval(() => {
          currentImage = (currentImage + 1) % sections[currentSection].images.length;
          showImage(currentImage);
        }, 5000);
      }

      function updateSection(key) {
        if (!sections[key] || key === currentSection) return;
        currentSection = key;
        currentImage = 0;
        const data = sections[key];

        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.section === key));
        copyWrap.classList.add('is-changing');
        clearTimeout(copyTimeout);

        copyTimeout = setTimeout(() => {
          eyebrow.textContent = data.eyebrow;
          title.innerHTML = data.title;
          lead.innerHTML = data.lead;
          bodyCopy.textContent = data.body;
          photoLabel.textContent = data.label;
          setDetails(data.details);
          copyWrap.classList.remove('is-changing');
        }, 170);

        showImage(0);
        startCarousel();
      }

      tabs.forEach(tab => {
        tab.addEventListener('pointerenter', () => updateSection(tab.dataset.section));
        tab.addEventListener('focus', () => updateSection(tab.dataset.section));
        tab.addEventListener('click', () => updateSection(tab.dataset.section));
      });

      const homeButton = document.getElementById('homeButton');
      homeButton.addEventListener('pointerenter', () => updateSection('main'));
      homeButton.addEventListener('focus', () => updateSection('main'));
      homeButton.addEventListener('click', () => updateSection('main'));

      slideA.src = sections.main.images[0];
      slideA.alt = sections.main.alts[0];
      front = 'A';
      restartProgress();
      startCarousel();
    })();
  </script>
</body>
</html>
